apis:
- aid: listnr:listnr-text-to-speech-api
  name: Listnr Text-to-Speech API
  tags:
  - Text to Speech
  - Speech Synthesis
  - Audio
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://listnr.ai/text-to-speech-api
  baseURL: https://bff.listnr.tech/api/tts/v1
  properties:
  - url: https://listnr.ai/text-to-speech-api
    type: Documentation
  - url: https://github.com/team-listnr/text-to-speech-api
    type: APIReference
  - url: openapi/listnr-openapi.yml
    type: OpenAPI
  - url: collections/listnr.postman_collection.json
    type: PostmanCollection
  - url: collections/listnr.opencollection.json
    type: OpenCollection
  description: Convert SSML text or an article URL into MP3/WAV speech using a
    chosen voice, voice style, speed, and sample rate. Synchronous endpoints
    return an audio URL directly; asynchronous endpoints return a jobId to poll.
    Endpoints are confirmed from Listnr's public GitHub API documentation.
- aid: listnr:listnr-voices-api
  name: Listnr Voices API
  tags:
  - Voices
  - Languages
  - Catalog
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://github.com/team-listnr/text-to-speech-api
  baseURL: https://bff.listnr.tech/api/tts/v1
  properties:
  - url: https://github.com/team-listnr/text-to-speech-api
    type: APIReference
  - url: openapi/listnr-openapi.yml
    type: OpenAPI
  - url: collections/listnr.postman_collection.json
    type: PostmanCollection
  - url: collections/listnr.opencollection.json
    type: OpenCollection
  description: List the voices available on Listnr, optionally filtered by
    language, gender, and style. Each voice returns its identifier, language,
    gender, and supported voice styles for use with the Text-to-Speech API.
- aid: listnr:listnr-audio-jobs-api
  name: Listnr Audio Jobs API
  tags:
  - Jobs
  - Async
  - Status
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://github.com/team-listnr/text-to-speech-api
  baseURL: https://bff.listnr.tech/api/tts/v1
  properties:
  - url: https://github.com/team-listnr/text-to-speech-api
    type: APIReference
  - url: openapi/listnr-openapi.yml
    type: OpenAPI
  - url: collections/listnr.postman_collection.json
    type: PostmanCollection
  - url: collections/listnr.opencollection.json
    type: OpenCollection
  description: Poll the status of an asynchronous text-to-speech or URL-to-speech
    job by jobId. Returns a status of PENDING, IN_PROGRESS, COMPLETED, or FAILED,
    plus the resulting audio URL and audio key when the job finishes.
