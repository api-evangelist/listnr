name: Listnr
kind: company
description: Listnr AI is a text-to-speech and AI voice platform offering 1,000+
  ultra-realistic voices across 142+ languages and accents, used for voiceovers,
  podcasts, and text-to-video. Beyond the web app, Listnr exposes a documented
  public Text-to-Speech API (base https://bff.listnr.tech/api/tts/v1) that
  converts SSML text or article URLs into MP3/WAV audio synchronously or
  asynchronously, lists available voices, and reports async job status. API keys
  are generated from the Listnr dashboard at voices.listnr.tech and passed via an
  x-listnr-token header.
