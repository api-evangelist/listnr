openapi: 3.2.0
info:
  title: Listnr Studio Billing API
  version: 1.0.0
  description: Public read API for Listnr Studio. Catalog, pricing, and docs are anonymous. Video generation is not performed on this host; send people to /create?tool=. Anonymous reads are capped at 60 requests per IP per minute on /api/v1, /mcp, and /ask (20 writes). Exceeding the cap returns 429 with RateLimit and Retry-After.
  contact:
    name: Listnr Studio
    email: support@listnr.ai
    url: https://studio.listnr.ai/contact
servers:
- url: https://studio.listnr.ai/api/v1
  description: Public sandbox (read-only)
security: []
tags:
- name: Billing
  description: Published plan and credit limits
paths:
  /pricing:
    get:
      operationId: getStudioPricing
      tags:
      - Billing
      summary: Published Studio plans
      description: Hobby, Growth, and Ultra prices and monthly credits.
      responses:
        '200':
          description: Pricing snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pricing'
        '429':
          description: Too many requests from this IP. Honor RateLimit and Retry-After.
          headers:
            RateLimit:
              schema:
                type: string
              description: IETF RateLimit header, e.g. limit=60, remaining=0, reset=12
            RateLimit-Policy:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            hint:
              type: string
            docs:
              type: string
              format: uri
            auth:
              type: string
              format: uri
    Pricing:
      type: object
      properties:
        currency:
          type: string
        plans:
          type: array
          items:
            type: object
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: Session or agent token. Catalog GET routes do not require it.
      flows:
        authorizationCode:
          authorizationUrl: https://studio.listnr.ai/login
          tokenUrl: https://studio.listnr.ai/api/v1/oauth/token
          scopes:
            tools:read: Read tools
            catalog:read: Read catalog
            docs:read: Read docs
            videos:write: Reserved for authenticated Studio projects; not granted on the public host
x-provenance:
  method: harvested
  publisher: Listnr
  source: https://studio.listnr.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
