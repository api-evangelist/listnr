meters:
- name: voice_credits
  description: Voice-generation credits (words/characters synthesized) consumed by web app and API, drawn from the monthly plan allowance.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - plan
- name: storage
  description: Stored audio/project storage against the plan's storage cap.
  unit: bytes
  aggregation: max
  dimensions:
  - account
  - plan
- name: videos
  description: Text-to-video generations against the plan's monthly video quota.
  unit: videos
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track monthly credit consumption against the plan allowance; attribute API-driven synthesis to the same pool as web-app usage.
- name: Allocation
  description: Map credit usage to teams or projects by API key / account so audio spend ties to internal cost centers.
- name: Optimization
  description: Match the plan tier to expected audio volume, reuse cached audio via audioKey, and batch large jobs through the async endpoints to avoid waste.
- name: Accountability
  description: Assign an owner per Listnr account; review monthly credit burn versus the plan allowance and upgrade or downgrade tiers accordingly.
