description: >-
  FinOps view of Listnr spend. Listnr bills on a monthly subscription basis in
  USD, metered primarily by voice-generation credits (words/characters of audio
  synthesized) with plan-level allowances for storage and video generation. The
  Text-to-Speech API shares the same account and credit pool as the web app, so
  API-driven synthesis draws down the same monthly allowance rather than
  incurring a separate per-call invoice. Cost is managed by picking the plan
  whose credit allowance matches expected audio volume and by using the async
  endpoints to batch large jobs.
notes: >-
  Listnr does not publish a separate per-request API price; API usage consumes
  plan credits. Verify current plan rates and credit-to-audio conversion on the
  Listnr pricing page.
